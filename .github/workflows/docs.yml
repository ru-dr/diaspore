# The documents describe one system, so they have to agree about it. Every
# inconsistency this project has had came from a fact stated in more than one
# file and changed in one of them, which is invisible in review and obvious to
# a reader. This runs on every push so the disagreement is caught by the
# person who introduced it.
name: docs

on:
  push:
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_docs.py
